name: 'release'

on:
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: enable corepack (yarn)
        run: corepack enable
      - uses: SebRollen/toml-action@v1.0.1
        id: version
        with:
          file: 'src-tauri/Cargo.toml'
          field: 'package.version'
      - run: echo ${{steps.version.outputs.value}}
      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
      - name: cache rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # bump when the whisper.cpp build flags below change, so it's rebuilt
          key: ggml-avx2-v1
      - name: install deps
        run: yarn install --immutable
      - name: compile
        run: yarn build
        env:
          CURSES_TWITCH_CLIENT_ID: ${{secrets.CURSES_TWITCH_CLIENT_ID}}
          CURSES_TWITCH_CLIENT_REDIRECT_LOCAL: ${{secrets.CURSES_TWITCH_CLIENT_REDIRECT_LOCAL}}
          # whisper.cpp CPU build: don't tune for the CI machine's CPU (it may
          # have AVX-512 that users' PCs don't); always use AVX2, which almost
          # every PC from the last ~10 years supports and is much faster than
          # the plain fallback
          GGML_NATIVE: "OFF"
          GGML_AVX: "ON"
          GGML_AVX2: "ON"
          GGML_FMA: "ON"
          GGML_F16C: "ON"
          GGML_BMI2: "ON"

      - name: create release
        uses: softprops/action-gh-release@v2
#        if: ${{startsWith(github.ref, 'refs/tags/') }}
        with:
          name: Release ${{steps.version.outputs.value}}
          tag_name: v${{steps.version.outputs.value}}
          draft: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            src-tauri/target/release/curses.exe
            src-tauri/target/release/bundle/msi/curses_${{steps.version.outputs.value}}_x64_en-US.msi
